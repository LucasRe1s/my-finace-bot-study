services:
  - type: web
    name: finncy-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    # Um worker so: cada worker teria sua propria Application do Telegram.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_MODE
        value: webhook
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Gerar com: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # (o generateValue do Render pode gerar caracteres que o Telegram recusa)
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
